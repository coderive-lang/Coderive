// Root project build file
// Read version from the VERSION file in the repo root
version = new File("${rootDir}/VERSION").text.trim()

// Packages cod/ and src/main/ into source_.zip (cod/ at the same level as src/main/)
task sourceZip(type: Zip) {
    archiveFileName = 'source_.zip'
    destinationDirectory = rootDir
    from('src/cod') {
        into 'cod'
    }
    from('src/main') {
        into 'src/main'
    }
}
